[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sphinx-privatus-analytics"
dynamic = ["version"]
description = "Sphinx extension that adds the cookieless Privatus Analytics tracking script to HTML builds."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Two Phase LLC", email = "james@privatusanalytics.com" }]
requires-python = ">=3.10"
keywords = ["sphinx", "sphinx-extension", "read-the-docs", "analytics", "privacy", "cookieless"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Extension",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
]
dependencies = ["sphinx>=7.2"]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["sphinx-privatus-analytics[test]", "ruff>=0.6", "build>=1.2"]

[project.urls]
Homepage = "https://privatusanalytics.com"
Documentation = "https://privatusanalytics.com/docs"
Repository = "https://github.com/Privatus-Analytics/sphinx"
Changelog = "https://github.com/Privatus-Analytics/sphinx/blob/main/CHANGELOG.md"
Issues = "https://github.com/Privatus-Analytics/sphinx/issues"

[tool.hatch.version]
path = "src/sphinx_privatus_analytics/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sphinx_privatus_analytics"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
